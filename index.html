const mk=(s,n)=>{const b=Uint8Array.from(atob(s),ch=>ch.charCodeAt(0)).buffer,sc=1/4000,q=new Int16Array(b,0,n*3),X=new Float32Array(n),Y=new Float32Array(n),Z=new Float32Array(n),W=new Float32Array(n),w=new Uint8Array(b,n*6,n);for(let i=0;i<n;i++){X[i]=q[i]*sc;Y[i]=q[n+i]*sc;Z[i]=q[2*n+i]*sc;W[i]=w[i]/255;}return{n,X,Y,Z,W};};

const RX=new Float32Array(NP*3);{let a=12345;for(let i=0;i<RX.length;i++){a=(a*1664525+1013904223)>>>0;RX[i]=a/2147483648-1;}}

 const cw=cv.width,ch=cv.height;
 if(!IM||IW!==cw||IH!==ch){IM=c.createImageData(cw,ch);U32=new Uint32Array(IM.data.buffer);IW=cw;IH=ch;}
 U32.fill(0);
 const q=Math.min(SS,2)/2,e=q*q*q*.8,fd=1-.35*q,qd=Math.min(SS/3,1),Dd=70-24*qd,TT=TH+SS*.9,ct=Math.cos(TT),st=Math.sin(TT),cp=Math.cos(PH),sp=Math.sin(PH),s0=Math.min(W,H)*.105*dpr,D=70,cx=cw/2,cy=ch*.54,n=NP,{X,Y,Z,W:Wt}=CS[MS],{X:X2,Y:Y2,Z:Z2,W:W2}=CS[(MS+1)%5]||CS[MS],mm=MM,fb=PC?FB:0,PX=PC?PC.X:X,PY=PC?PC.Y:Y,PZ=PC?PC.Z:Z,PW=PC?PC.W:Wt,ee=e+Math.sin(Math.PI*mm)*.22*(1-fb)+Math.sin(Math.PI*fb)*.22;
 for(let i=0;i<n;i++){
  let x=X[i]+(X2[i]-X[i])*mm,y=Y[i]+(Y2[i]-Y[i])*mm,z=Z[i]+(Z2[i]-Z[i])*mm,Wm=Wt[i]+(W2[i]-Wt[i])*mm;
  if(fb>0){x+=(PX[i]-x)*fb;y+=(PY[i]-y)*fb;z+=(PZ[i]-z)*fb;Wm+=(PW[i]-Wm)*fb;}
  if(Wm<.03)continue;x+=RX[3*i]*ee;y+=RX[3*i+1]*ee;z+=RX[3*i+2]*ee;
  const x1=x*ct+z*st,z1=-x*st+z*ct,y2=y*cp-z1*sp,z2=y*sp+z1*cp;const dd=Dd+z2;if(dd<.3)continue;
  const p=D/(D+z2),pp=D/dd,sx=Math.round(cx+x1*s0*pp),sy=Math.round(cy-y2*s0*pp),m=Math.max(1,Math.min(4*dpr,Math.round(dpr*(.5+.35*Math.min(pp,8)))));
  if(sx<0||sy<0||sx+m>cw||sy+m>ch)continue;
  const a=Math.max(90,Math.min(1,.75+(p-1)*4.2)*255*Wm*K*fd)*Math.min(1,dd/1.8)*Math.min(1,Wm*6)|0;if(a<6)continue;const v=((a<<24)|(DK?0x00C8C8C8:0x00606060))>>>0;
  for(let yy=0;yy<m;yy++){let k=(sy+yy)*cw+sx;for(let xx=0;xx<m;xx++,k++){if((U32[k]>>>24)<a)U32[k]=v;}}
 }

 {const P=PCU&&PCC[PCU],ok=P&&typeof P==='object';if(ok)PC=P;const tf=ok?1:0;FB+=(tf-FB)*(R?1:Math.min(1,dt*.9));if(!tf&&FB<.002)FB=0;}
 {const tg=(K===1||PCU)?Math.min(3,scrollY/H):0;SS+=(tg-SS)*(R?1:Math.min(1,dt*5));}

/* Image carousels (project pages): arrows are play-style triangles that dissolve into points when pressed */
function dissolve(btn,dir){
 const sv=btn.querySelector('svg');
 if(R){return;}
 let cv=btn.querySelector('canvas');
 if(!cv){cv=document.createElement('canvas');cv.className='dz';btn.appendChild(cv);}
 const dp=Math.min(devicePixelRatio||1,2),S=160*dp;cv.width=S;cv.height=S;
 const x=cv.getContext('2d'),col=getComputedStyle(btn).color,k=26/24*dp,N=120,A=[[4.5,1.5],[4.5,22.3],[22.5,12]],P=[];
 for(let i=0;i<N;i++){let u=Math.random(),v=Math.random();if(u+v>1){u=1-u;v=1-v;}
  const px=A[0][0]+u*(A[1][0]-A[0][0])+v*(A[2][0]-A[0][0]),py=A[0][1]+u*(A[1][1]-A[0][1])+v*(A[2][1]-A[0][1]),
  hx=(px-12)*k*(dir<0?-1:1),hy=(py-12)*k,a=Math.random()*6.283,r=(14+Math.random()*34)*dp;
  P.push({hx,hy,tx:hx+Math.cos(a)*r+dir*8*dp*Math.random(),ty:hy+Math.sin(a)*r,s:(.7+Math.random()*1.1)*dp});}

 const t0=performance.now(),T=950,e=t=>t*t*(3-2*t);
 (function f(now){
  if(btn._t!==id)return;
  const t=Math.min(1,(now-t0)/T);let m;
  if(t<.45)m=e(t/.45);else if(t<.55)m=1;else m=1-e((t-.55)/.45);
  x.clearRect(0,0,S,S);x.fillStyle=col;x.globalAlpha=1;
  for(const p of P){x.fillRect(S/2+p.hx+(p.tx-p.hx)*m,S/2+p.hy+(p.ty-p.hy)*m,p.s,p.s);}

  if(t<1)requestAnimationFrame(f);else{x.clearRect(0,0,S,S);btn.classList.remove('go','back');}
 })(t0);
}
